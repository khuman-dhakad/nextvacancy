name: Stack migration quality

on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nextvacancy_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test Spring Boot backend
        run: mvn -B -ntp -f backend/pom.xml verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nextvacancy_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_JPA_HIBERNATE_DDL_AUTO: create
          CORS_ALLOWED_ORIGINS: https://localhost:3000
          JWT_SECRET: test-secret-key-for-ci-cd-pipeline-min-32-chars-required

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test React frontend
        run: npm test

      - name: Build React frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.nextvacancy.com/api