name: Stack migration quality

on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test Spring Boot backend
        run: mvn -B -ntp -f backend/pom.xml verify
        env:
          JWT_SECRET: ci-test-jwt-secret-change-for-ci-only
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          APP_PUBLIC_URL: http://localhost:5173

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test React frontend
        run: npm test

      - name: Validate configured production API origin
        run: node --input-type=module -e "import { parseApiBaseUrl } from './src/apiConfiguration.js'; parseApiBaseUrl(process.env.VITE_API_BASE_URL, true);"
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://nextvacancy-api.onrender.com' }}

      - name: Build React frontend (CI validation only; do not deploy)
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://nextvacancy-api.onrender.com' }}