spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:15}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000

app:
  environment: production
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
  public-url: ${APP_PUBLIC_URL}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoint:
    health:
      show-details: never

logging:
  file:
    name: ${LOG_FILE:/var/log/nextvacancy/api.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
