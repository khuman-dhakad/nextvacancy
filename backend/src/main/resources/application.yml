spring:
  application:
    name: nextvacancy-api
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:}}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  flyway:
    enabled: true
    baseline-on-migrate: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
          batch_size: 20
  mail:
    default-encoding: UTF-8
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
    info:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

app:
  environment: ${APP_ENVIRONMENT:development}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: nextvacancy
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
  admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
  email:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM_EMAIL:}
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}

logging:
  level:
    root: WARN
    com.nextvacancy: INFO
    org.springframework.security: INFO
    org.springframework.boot: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'